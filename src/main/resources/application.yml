spring:
  application:
    name: rag-qa

  # 数据源：凭据一律走环境变量，避免把密钥写进代码 / 提交到 Git。
  # 未设置环境变量时使用下面的默认值（本地开发默认 root 无密码）。
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/rag_db?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # 阶段 6 引入 Document 实体后改为 update，启动时自动建表 / 更新表结构。
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # 大模型：DeepSeek（走 OpenAI 兼容接口），key 一律放环境变量
  ai:
    openai:
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      api-key: ${DEEPSEEK_API_KEY:}
      chat:
        options:
          model: deepseek-flash
          temperature: 0.7
          # max-tokens: 2048   # 如需限制回答长度可打开
      # 向量化：硅基流动（OpenAI 兼容），与 chat 分开的 base-url / key
      # 注意：base-url 不要带 /v1——Spring AI 会自动拼 /v1/embeddings，带了会变成 /v1/v1/embeddings
      embedding:
        base-url: ${EMBEDDING_BASE_URL:https://api.siliconflow.cn}
        api-key: ${EMBEDDING_API_KEY:}
        options:
          model: Qwen/Qwen3-Embedding-0.6B

  # 上传文件大小限制（阶段 3 文档解析接口）
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

# 阶段 3：切块参数（固定字符数 + 重叠，中文按字符计）
rag:
  chunk-size: 500
  chunk-overlap: 50
