spring:
  application:
    name: rag-qa

  # 数据源：阶段 6b 起统一用 PostgreSQL——文档表和 pgvector 向量表在同一个库里。
  # 凭据一律走环境变量，避免把密码写进代码 / 提交到 Git。
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rag_db}
    username: ${DB_USERNAME:raguser}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # 启动时按实体自动建表 / 更新表结构。
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # 大模型：DeepSeek（走 OpenAI 兼容接口），key 一律放环境变量
  ai:
    openai:
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      api-key: ${DEEPSEEK_API_KEY:}
      chat:
        options:
          model: deepseek-flash
          temperature: 0.7
          # max-tokens: 2048   # 如需限制回答长度可打开
      # 向量化：硅基流动（OpenAI 兼容），与 chat 分开的 base-url / key
      # 注意：base-url 不要带 /v1——Spring AI 会自动拼 /v1/embeddings，带了会变成 /v1/v1/embeddings
      embedding:
        base-url: ${EMBEDDING_BASE_URL:https://api.siliconflow.cn}
        api-key: ${EMBEDDING_API_KEY:}
        options:
          model: Qwen/Qwen3-Embedding-0.6B

    # 向量库：pgvector（阶段 6b）。自动配置会抓应用里的主数据源（也就是上面那个
    # PostgreSQL），所以这里不需要再写一遍连接串——这正是「全项目一个库」的好处。
    vectorstore:
      pgvector:
        # 必须与 Embedding 模型输出维度一致，Qwen3-Embedding-0.6B 是 1024 维。
        # 配错会在启动或首次写入时报维度不匹配的错。
        dimensions: 1024
        # id 列类型。默认是 UUID，但我们的向量 id 用的是「文档id-块序号」这种文本
        # （见 VectorStoreService），默认值会让插入报 Invalid UUID string。必须显式设成 TEXT。
        id-type: TEXT
        # 启动时自动执行 CREATE EXTENSION vector、建向量表、建索引。
        initialize-schema: true
        # HNSW 是近似最近邻索引，检索快、召回好；数据量很小时也可以设成 NONE。
        index-type: HNSW
        # 与 Embedding 的语义匹配：余弦距离，分数越大越相似（和之前 SimpleVectorStore 一致）。
        distance-type: COSINE_DISTANCE

  # 上传文件大小限制（阶段 3 文档解析接口）
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

# 阶段 3：切块参数（固定字符数 + 重叠，中文按字符计）
rag:
  chunk-size: 500
  chunk-overlap: 50
  # 阶段 6：检索相似度阈值（0~1）。低于它的检索结果会被丢弃，这样「检索结果为空」
  # 才真正等价于「没有相关内容」，上层的严格模式才有意义。
  # 实测（Qwen3-Embedding-0.6B）：无关问题约 0.17，相关问题 0.54~0.67，故取中间值 0.35。
  # 如果发现本该能回答的问题被拦成「资料库中没有找到相关信息」，把这个值调低。
  similarity-threshold: 0.35
